<div
  class="flex min-w-[320px] max-w-[560px] flex-col gap-6 p-6 text-gray-900 dark:text-gray-100 sm:p-7">
  <!-- Header -->
  <h2 class="m-0 text-xl leading-snug font-medium sm:text-2xl">
    {{ data.title }}
  </h2>

  <!-- Message -->
  @if (data.message) {
    <p
      class="m-0 whitespace-pre-line text-base leading-relaxed text-gray-600 dark:text-gray-300 sm:text-lg">
      {{ data.message }}
    </p>
  }

  <!-- Actions -->
  <div class="flex flex-wrap items-center justify-end gap-3">
    <button
      mat-button
      type="button"
      (click)="cancel()">
      {{ data.cancelText || 'Cancel' }}
    </button>

    <button
      mat-flat-button
      color="primary"
      type="button"
      class="!rounded-full !px-6"
      (click)="confirm()">
      {{ data.confirmText || 'OK' }}
    </button>
  </div>
</div>
