<h2 mat-dialog-title>Error details</h2>

<mat-dialog-content>
  <div class="error-message">
    {{ data.message }}
  </div>

  <pre class="error-details"><code>{{ data.details }}</code></pre>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    mat-dialog-close>
    Close
  </button>
</mat-dialog-actions>
