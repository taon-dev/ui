<h2 mat-dialog-title>{{ t.gettext('Error details') }}</h2>

<mat-dialog-content>
  <div class="error-message">
    {{ data.message }}
  </div>

  <div class="editor-selector">
    <span class="editor-selector-label">{{ t.gettext('I am using editor:') }}</span>

    <mat-button-toggle-group
      [value]="editor"
      (change)="setEditor($event.value)"
      [attr.aria-label]="t.gettext('Code editor')">
      <mat-button-toggle value="vscode"> VS Code </mat-button-toggle>

      <mat-button-toggle value="vscodium"> VSCodium </mat-button-toggle>
    </mat-button-toggle-group>
  </div>

  <pre
    class="error-details"><code>@for (stackLine of stackLines; track $index) {
@if (stackLine.file) {<a
  class="stack-link"
  [title]="
    t.gettext('Open [[ file ]]:[[ line ]]:[[ column ]]', {
      file: stackLine.file,
      line: stackLine.line,
      column: stackLine.column,
    })
  "
  (click)="openStackLine(stackLine)">{{ stackLine.text }}</a>} @else {{{ stackLine.text }}}{{ '\n' }}
}</code></pre>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button
    mat-button
    mat-dialog-close>
    {{ t.gettext('Close') }}
  </button>
</mat-dialog-actions>
