@if (currentState() === State.CLICKABLE_BUTTON) {
  <!-- ============================================================ -->
  <!-- BUTTON -->
  <!-- ============================================================ -->

  <button
    mat-icon-button
    type="button"
    [matTooltip]="title"
    (click)="open()">
    <mat-icon>
      {{ buttonIcon }}
    </mat-icon>
  </button>
} @else {
  <!-- ============================================================ -->
  <!-- PANEL -->
  <!-- ============================================================ -->

  <section
    cdkDrag
    [cdkDragDisabled]="!isDraggingEnabled()"
    class="taon-draggable-panel"
    [class.taon-window]="currentState() === State.WINDOW"
    [class.taon-fullscreen]="
      currentState() === State.FULL_SCREEN_DRAGGABLE ||
      currentState() === State.FULL_SCREEN_LOCKED
    ">
    <!-- ========================================================== -->
    <!-- WINDOW BAR / DRAG HANDLE -->
    <!-- ========================================================== -->

    <header
      cdkDragHandle
      class="taon-window-bar">
      <div class="flex min-w-0 flex-1 items-center gap-2">
        <mat-icon class="text-gray-500"> admin_panel_settings </mat-icon>

        <span class="truncate font-medium">
          {{ title }}
        </span>
      </div>

      <div class="flex shrink-0 items-center">
        <!-- WINDOW MODE -->

        @if (currentState() !== State.WINDOW) {
          <button
            mat-icon-button
            type="button"
            matTooltip="Window mode"
            (click)="windowMode()">
            <mat-icon> filter_none </mat-icon>
          </button>
        }

        <!-- FULLSCREEN -->

        @if (currentState() === State.WINDOW) {
          <button
            mat-icon-button
            type="button"
            matTooltip="Full screen"
            (click)="fullScreenDraggable()">
            <mat-icon> fullscreen </mat-icon>
          </button>
        }

        <!-- LOCK -->

        @if (currentState() !== State.FULL_SCREEN_LOCKED) {
          <button
            mat-icon-button
            type="button"
            matTooltip="Lock full screen"
            (click)="lockFullScreen()">
            <mat-icon> lock_open </mat-icon>
          </button>
        } @else {
          <button
            mat-icon-button
            type="button"
            matTooltip="Unlock"
            (click)="fullScreenDraggable()">
            <mat-icon> lock </mat-icon>
          </button>
        }

        <!-- RETURN TO BUTTON -->

        <button
          mat-icon-button
          type="button"
          matTooltip="Close admin panel"
          (click)="returnToButton()">
          <mat-icon> close </mat-icon>
        </button>
      </div>
    </header>

    <!-- ========================================================== -->
    <!-- CONTENT -->
    <!-- ========================================================== -->

    <div class="min-h-0 flex-1 overflow-hidden">
      <ng-content />
    </div>
  </section>
}
