@if (currentState() === State.CLICKABLE_BUTTON) {
  <!-- #region BUTTON - works on desktop AND mobile -->
  <button
    class="taon-admin-panel-toogle-open-button"
    mat-icon-button
    type="button"
    [matTooltip]="title"
    (click)="open()">
    <mat-icon>
      {{ buttonIcon }}
    </mat-icon>
  </button>
  <!-- #endregion -->
} @else {
  <section
    cdkDrag
    [cdkDragDisabled]="!isDraggingEnabled()"
    class="taon-draggable-panel"
    [class.taon-window]="effectiveState() === State.WINDOW"
    [class.taon-fullscreen]="
      effectiveState() === State.FULL_SCREEN_DRAGGABLE ||
      effectiveState() === State.FULL_SCREEN_LOCKED
    ">
    <header
      cdkDragHandle
      (dblclick)="toogleFullscreen($event)"
      class="taon-window-bar">
      <div class="flex min-w-0 flex-1 items-center gap-2">
        <mat-icon class="text-gray-500"> admin_panel_settings </mat-icon>

        <span class="truncate font-medium">
          {{ title }}
        </span>
      </div>

      <!-- #region window buttons -->
      <div class="flex shrink-0 items-center">
        <!-- Desktop-only window/fullscreen controls -->
        @if (!forceFullScreen()) {
          @if (currentState() !== State.WINDOW) {
            <button
              mat-icon-button
              type="button"
              matTooltip="Window mode"
              (click)="windowMode()">
              <mat-icon>filter_none</mat-icon>
            </button>
          }

          @if (currentState() === State.WINDOW) {
            <button
              mat-icon-button
              type="button"
              matTooltip="Full screen"
              (click)="fullScreenDraggable()">
              <mat-icon>fullscreen</mat-icon>
            </button>
          }

          @if (currentState() !== State.FULL_SCREEN_LOCKED) {
            <button
              mat-icon-button
              type="button"
              matTooltip="Lock full screen"
              (click)="lockFullScreen()">
              <mat-icon>lock_open</mat-icon>
            </button>
          } @else {
            <button
              mat-icon-button
              type="button"
              matTooltip="Unlock"
              (click)="fullScreenDraggable()">
              <mat-icon>lock</mat-icon>
            </button>
          }
        }

        <!-- ALWAYS available -->
        <button
          mat-icon-button
          type="button"
          matTooltip="Close admin panel"
          (click)="returnToButton()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <!-- #endregion -->
    </header>

    <div class="min-h-0 flex-1 overflow-hidden">
      <ng-content />
    </div>
  </section>
}
