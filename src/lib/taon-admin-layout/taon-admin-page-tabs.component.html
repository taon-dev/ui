@if (levels().length) {
  <div class="shrink-0 border-b border-gray-200 bg-white">
    @for (level of levels(); track level.level) {
      <nav
        mat-tab-nav-bar
        [tabPanel]="tabPanel">
        @for (route of level.routes; track route.path) {
          <a
            mat-tab-link
            class="cursor-pointer"
            [active]="isActive(level, route)"
            (click)="tabClicked(level, route)">
            {{ label(route) }}
          </a>
        }
      </nav>
    }
  </div>
}

<mat-tab-nav-panel #tabPanel> </mat-tab-nav-panel>
