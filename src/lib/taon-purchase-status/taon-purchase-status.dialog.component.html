<h2 mat-dialog-title>
  {{
    data.success
      ? t.gettext('Payment successful')
      : t.gettext('Payment cancelled')
  }}
</h2>

<div mat-dialog-content>{{ data.message }}</div>

<div
  mat-dialog-actions
  align="end">
  <button
    mat-button
    mat-dialog-close>
    {{ t.gettext('OK') }}
  </button>
</div>
